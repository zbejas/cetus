name: Release

on:
  push:
    branches: [master]
    paths:
      - package.json
      - .github/workflows/release.yml
      - .github/workflows/docker-publish.yml
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and push the image for an already-released version
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Check package version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read version and check GitHub Release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r '.version // empty' package.json)"
          if [ -z "$version" ]; then
            echo "::error::package.json has no version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version is already released"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version is new"
          fi

  verify:
    name: Verify release
    needs: version
    if: needs.version.outputs.should_release == 'true' || github.event.inputs.force == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.should_release == 'true' && github.sha || format('v{0}', needs.version.outputs.version) }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun test apps packages

      - name: Build web
        run: bun run build:web

  docker:
    name: Publish container image
    needs: [version, verify]
    if: needs.version.outputs.should_release == 'true' || github.event.inputs.force == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ needs.version.outputs.version }}
      latest: ${{ needs.version.outputs.should_release == 'true' }}
      ref: ${{ needs.version.outputs.should_release == 'true' && github.sha || format('v{0}', needs.version.outputs.version) }}

  release:
    name: Create GitHub Release
    needs: [version, docker]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          args=(
            "v$VERSION"
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "Cetus v$VERSION"
            --generate-notes
          )
          if [[ "$VERSION" == *-* ]]; then args+=(--prerelease); fi
          gh release create "${args[@]}" compose/manager.yaml compose/worker.yaml
